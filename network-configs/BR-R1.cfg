! =====================================================================
! Device: BR-R1 (Cisco IOSv)
! Role: Branch Edge Router (IPSec/GRE, OSPF Area 0, TCP MSS 1360)
! =====================================================================
hostname BR-R1
no ip domain-lookup
!
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
crypto isakmp key LAB_IPSEC_KEY_2026 address 10.255.0.1
!
crypto ipsec transform-set TS_AES256_SHA256 esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile HQ_BR_IPSEC_PROF
 set transform-set TS_AES256_SHA256
!
interface Tunnel0
 description ENCRYPTED_GRE_IPSEC_TO_HQ-R1
 ip address 10.255.0.10 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/1
 tunnel destination 10.255.0.1
 tunnel protection ipsec profile HQ_BR_IPSEC_PROF
!
interface GigabitEthernet0/0
 description BRANCH_LAN_GATEWAY
 ip address 10.20.10.1 255.255.255.0
!
interface GigabitEthernet0/1
 description WAN_LINK_TO_ISP-R1
 ip address 10.255.0.6 255.255.255.252
!
router ospf 1
 router-id 2.2.2.2
 passive-interface GigabitEthernet0/0
 network 10.20.10.0 0.0.0.255 area 0
 network 10.255.0.8 0.0.0.3 area 0
!
ip route 10.255.0.0 255.255.255.252 10.255.0.5
end