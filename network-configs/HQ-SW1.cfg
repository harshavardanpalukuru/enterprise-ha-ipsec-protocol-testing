! =====================================================================
! Device: HQ-SW1 (Cisco IOSvL2)
! Role: Primary Distribution/Access Switch (RSTP Root, LACP, Snooping, DAI)
! =====================================================================
hostname HQ-SW1
no ip domain-lookup
!
vlan 10
 name HQ_CORP_LAN
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10 root primary
!
ip dhcp snooping
ip dhcp snooping vlan 10
no ip dhcp snooping information option
ip arp inspection vlan 10
!
arp access-list STATIC_HOST_ARP
 permit ip host 10.10.10.50 mac any
!
ip arp inspection filter STATIC_HOST_ARP vlan 10
!
interface Port-channel1
 description LACP_PO1_TO_HQ-SW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 ip dhcp snooping trust
 ip arp inspection trust
!
interface GigabitEthernet0/0
 description LACP_TRUNK_TO_HQ-SW2_LINK1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 ip dhcp snooping trust
 ip arp inspection trust
 channel-group 1 mode active
!
interface GigabitEthernet0/1
 description LACP_TRUNK_TO_HQ-SW2_LINK2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 ip dhcp snooping trust
 ip arp inspection trust
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 description UPLINK_TO_HQ-R1_ACTIVE_GW
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ip dhcp snooping trust
 ip arp inspection trust
!
interface GigabitEthernet0/3
 description ACCESS_PORT_TO_HQ_HOST
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip arp inspection limit rate 15
!
interface Vlan10
 ip address 10.10.10.4 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.10.1
end