! =====================================================================
! Device: HQ-SW2 (Cisco IOSvL2)
! Role: Secondary Distribution/Access Switch (RSTP Secondary, LACP Po1)
! =====================================================================
hostname HQ-SW2
no ip domain-lookup
!
vlan 10
 name HQ_CORP_LAN
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10 root secondary
!
interface Port-channel1
 description LACP_PO1_TO_HQ-SW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
!
interface GigabitEthernet0/0
 description LACP_TRUNK_TO_HQ-SW1_LINK1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 channel-group 1 mode active
!
interface GigabitEthernet0/1
 description LACP_TRUNK_TO_HQ-SW1_LINK2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 description UPLINK_TO_HQ-R2_STANDBY_GW
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface Vlan10
 ip address 10.10.10.5 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.10.1
end