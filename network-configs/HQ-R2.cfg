! =====================================================================
! Device: HQ-R2 (Cisco IOSv)
! Role: HQ Standby Gateway (HSRP Group 10 Priority 100)
! =====================================================================
hostname HQ-R2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description HQ_LAN_HSRP_STANDBY
 ip address 10.10.10.3 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 standby 10 preempt
end