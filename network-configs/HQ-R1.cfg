! =====================================================================
! Device: HQ-R1 (Cisco IOSv)
! Role: HQ Active Gateway (HSRP Priority 110, IPSec/GRE, OSPF, SNMPv3)
! =====================================================================
hostname HQ-R1
no ip domain-lookup
!
track 1 interface GigabitEthernet0/1 line-protocol
!
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
crypto isakmp key LAB_IPSEC_KEY_2026 address 10.255.0.6
!
crypto ipsec transform-set TS_AES256_SHA256 esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile HQ_BR_IPSEC_PROF
 set transform-set TS_AES256_SHA256
!
interface Tunnel0
 description ENCRYPTED_GRE_IPSEC_TO_BR-R1
 ip address 10.255.0.9 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/1
 tunnel destination 10.255.0.6
 tunnel protection ipsec profile HQ_BR_IPSEC_PROF
!
interface GigabitEthernet0/0
 description HQ_LAN_HSRP_ACTIVE
 ip address 10.10.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 track 1 decrement 20
!
interface GigabitEthernet0/1
 description WAN_LINK_TO_ISP-R1
 ip address 10.255.0.1 255.255.255.252
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.255.0.8 0.0.0.3 area 0
!
ip route 10.255.0.4 255.255.255.252 10.255.0.2
!
snmp-server group NOC_V3_GRP v3 priv
snmp-server user nocadmin NOC_V3_GRP v3 auth sha AuthPass2026! priv aes 128 PrivPass2026!
snmp-server enable traps hsrp
snmp-server enable traps ospf state-change
logging host 10.10.10.50
logging trap informational
end